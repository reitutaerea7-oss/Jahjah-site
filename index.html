
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAHJAH JARVIS AI</title>
  <style>
    body {
      background: #0c101c;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 { color: #63e0ed; }
    input, button {
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      margin: 5px 0;
    }
    input { width: 85%; }
    button {
      background: #63e0ed;
      border: none;
      cursor: pointer;
    }
    #jarvis-result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
/* JAHJAH JARVIS AI — DARK MODE */

body {
  background: radial-gradient(
    circle at 50% 35%,
    #102638 0%,
    #050b14 45%,
    #010308 100%
  );
  color: #e5f8ff;
  min-height: 100vh;
}

h1 {
  color: #62eaff;
  text-shadow: 0 0 20px #00cfff80;
}

input {
  background: #081827;
  color: #e5f8ff;
  border: 1px solid #23627d;
  box-shadow: 0 0 12px #00cfff20;
}

button {
  background: #07364b;
  color: #65edff;
  border: 1px solid #35cfff;
  box-shadow: 0 0 15px #00cfff40;
}

#jarvis-result {
  color: #bcefff;
  background: #071523;
  border: 1px solid #20536b;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}
.jarvis-core-inner {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    #ffffff 0%,
    #8cf5ff 20%,
    #00bfff 50%,
    #00354f 100%
  );
  box-shadow:
    0 0 25px #00dfff,
    0 0 60px #00bfff,
    inset 0 0 20px #ffffff80;
}
.jarvis-core {
  width: 220px;
  height: 220px;
  margin: 35px auto;
  border: 3px solid #55eaff;
  border-radius: 50%;
  background: radial-gradient(circle, #126078, #071827 55%, #02060d);
  box-shadow: 0 0 30px #00dfff;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: jarvisPulse 3s infinite ease-in-out;
}

@keyframes jarvisPulse {
  0%, 100% { box-shadow: 0 0 20px #00dfff; }
  50% { box-shadow: 0 0 55px #00dfff; }
}

  </style>
</head>
<body>
  <h1>🤖 JAHJAH JARVIS AI</h1>
  <p>Centre de commande connecté à Cloudflare</p>
<div class="jarvis-core">
  <div class="jarvis-core-inner"></div>
</div>

  <input id="jarvis-command"
         placeholder="Écris une commande...">

  <button id="send-button" onclick="sendJarvis()">
    Envoyer à JAHJAH
  </button>
  <button type="button" onclick="startJarvisVoice()">
  🎤 Parler à JAHJAH
</button>

<p id="voice-status"></p>

  <p id="jarvis-result" role="status"></p>

  <script>

    function startJarvisVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const status =
    document.getElementById("voice-status");

  const core =
    document.querySelector(".jarvis-core");

  if (!SpeechRecognition) {
    status.textContent =
      "Reconnaissance vocale indisponible dans ce navigateur.";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "fr-FR";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    status.textContent = "🎤 JAHJAH écoute...";
    core?.classList.add("listening");
  };

  recognition.onresult = (event) => {
    const message =
      event.results[0][0].transcript;

    document.getElementById(
      "jarvis-command"
    ).value = message;

    status.textContent =
      "Commande reconnue : " + message;
  };

  recognition.onerror = (event) => {
    status.textContent =
      "Erreur microphone : " + event.error;
  };

  recognition.onend = () => {
    core?.classList.remove("listening");
  };

  recognition.start();
}

    // VOIX FRANÇAISE JAHJAH JARVIS AI

function speakJarvis(texte) {
  if (!("speechSynthesis" in window) || !texte) {
    return;
  }

  const voix = new SpeechSynthesisUtterance(
    String(texte)
  );

  voix.lang = "fr-FR";
  voix.rate = 0.95;
  voix.pitch = 1;
  voix.volume = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(voix);
}
    const PROXY_URL =
      "https://jahjah-jarvis-proxy.reitutaerea7.workers.dev/";

    async function sendJarvis() {
      const message = document
        .getElementById("jarvis-command").value.trim();

      const result = document.getElementById("jarvis-result");
      const button = document.getElementById("send-button");

      if (!message) {
        result.textContent = "Écris une commande.";
        return;
      }

      button.disabled = true;
      result.textContent = "JAHJAH réfléchit...";

      try {
        const response = await fetch(PROXY_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const text = await response.text();

        if (!response.ok) {
          throw new Error(
            "Erreur HTTP " + response.status + " : " + text
          );
        }

        try {
          const data = JSON.parse(text);
          
const reply =
  typeof data === "string"
    ? data
    : data.reply || data.output ||
      data.response || data.message ||
      JSON.stringify(data, null, 2);



let cleanReply = reply;

for (let i = 0; i < 3; i++) {
  if (typeof cleanReply !== "string") break;

  try {
    const parsed = JSON.parse(cleanReply);
    cleanReply = parsed.reply ?? parsed.output ??
                 parsed.response ?? parsed.message ?? parsed;
  } catch {
    break;
  }
}

result.textContent = String(cleanReply)
  .replace(/\\n/g, "\n")
  .replace(/\\r/g, "")
  .replace(/\\"/g, '"');

speakJarvis(result.textContent);

  const videoUrl = data.video_url;
const videoStatus = data.video_status;

if (
  videoStatus === "done" &&
  typeof videoUrl === "string" &&
  videoUrl.startsWith("https://")
) {
  const video = document.createElement("video");
  video.src = videoUrl;
  video.controls = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.style.width = "100%";
  video.style.maxWidth = "480px";
  video.style.marginTop = "20px";
  video.style.borderRadius = "12px";

  const link = document.createElement("a");
  link.href = videoUrl;
  link.textContent = "🎬 Ouvrir la vidéo MP4";
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.style.display = "block";
  link.style.marginTop = "12px";

  result.appendChild(video);
  result.appendChild(link);
}


        } catch {
          result.textContent = text || "Réponse vide.";
        }

      } catch (error) {
        result.textContent =
          "Erreur de connexion : " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
